<div class="width-4xl">
  <div class="project-header">
    <a class="back-link" href="/cv/"><!-- icon: ArrowLeft 16 -->Back to CV</a>
    <nav class="project-switch" aria-label="Project category">
<!-- slot: project-switch -->
    </nav>
  </div>
  <div class="project-intro">
    <a class="project-eyebrow" href="/projects/">Projects</a>
    <h1 class="project-title">{{ name }}</h1>
    <p class="gradient-text project-summary">{{ summary }}</p>
  </div>
  <article class="panel panel-3xl panel-responsive project-card">
    <div class="project-meta">
      <span class="project-date">{{ date }}</span>
      <!-- slot: project-tags -->
    </div>
<!-- slot: project-main -->
  </article>
<!-- slot: project-nav -->
</div>
