<div class="landing">
  <div class="width-5xl">
<!-- slot: landing-header -->
    <div class="landing-hero">
      <img class="landing-icon" src="{{ icon }}" alt="{{ app }} app icon" width="112" height="112">
      <div>
        <h1 class="landing-name">{{ app }}</h1>
        <p class="landing-tagline gradient-text">{{ tagline }}</p>
        <p class="landing-intro">{{ intro }}</p>
      </div>
    </div>
    <div class="landing-cta">
      <!-- slot: landing-badge -->
      <p class="landing-note">{{ cta_note }}</p>
<!-- slot: landing-platforms -->
    </div>
<!-- slot: landing-sections -->
    <div class="landing-outro">
      <h2>{{ outro_heading }}</h2>
      <p class="landing-outro-body">{{ outro_body }}</p>
      <div class="landing-outro-badge"><!-- slot: landing-badge --></div>
      <p class="landing-outro-links"><!-- slot: landing-links --></p>
    </div>
  </div>
</div>
